---
name: DepTyCheck

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - main
      - master
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # We want to run in the beginning of the day, right after the `pack` collection is built at the end of the previous day.
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}@${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# TODO to reduce duplication, e.g. by using https://docs.github.com/en/actions/using-workflows/reusing-workflows

jobs:

  ##############
  # Validation #
  ##############

  validate_trigger:
    name: Validate trigger
    # Disable scheduled running on forks and PRs from the same repo
    if: github.event_name != 'schedule' && github.event_name != 'pull_request' ||
        github.event_name == 'schedule' && github.repository_owner == 'buzden' ||
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - name: No-op step
        run: echo "This job exists only for validation."

  get-pack-collection:
    name: Select pack collection
    needs: validate_trigger
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    outputs:
      pack_collections: ${{ steps.collection.outputs.pack_collections }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'schedule'
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked

      - name: Select pack collection
        id: collection
        run: |
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then
            COLLECTION="HEAD"
          else
            COLLECTION=$(./.pack-collection)
          fi

          echo "pack_collections=[\"$COLLECTION\"]" >> "$GITHUB_OUTPUT"

  ############################
  # Build DepTyCheck library #
  ############################

  deptycheck-build-lib:
    name: Build DepTyCheck
    needs: get-pack-collection
    uses: DepTyCheck/idris2-actions/.github/workflows/build-and-test.yml@v1
    with:
      pack_collections: ${{ needs.get-pack-collection.outputs.pack_collections }}
      run_tests: false
      pack_extras: summary-stat

  ########################
  # Test elab-util-extra #
  ########################

  elab-util-extra-test:
    name: Test elab-util-extra
    needs: deptycheck-build-lib # depends on deptycheck-build-lib to share pack state with other jobs, not because deptycheck itself is required
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Restore state with extra deps
        uses: DepTyCheck/idris2-actions/.github/actions/restore-pack-state@v1
        with:
          # There is always one element in pack_states (either HEAD or ./.pack-collection)
          state: ${{ fromJSON(needs.deptycheck-build-lib.outputs.pack_states)[0] }}

      - run: pack test elab-util-extra

  ###########################
  # Build DepTyCheck's docs #
  ###########################

  deptycheck-build-docs:
    name: Build the docs
    needs: validate_trigger
    runs-on: ubuntu-latest
    container: sphinxdoc/sphinx:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Install dependencies
        run: pip3 install -r docs/requirements.txt
      - run: alias sh=bash
      # - run: pack build docs # `pack` is unaccessible here, thus:
      - run: cd docs && eval "$(grep prebuild docs.ipkg | sed 's/.*"\(.*\)"/\1/')"

  ###################
  # Test DepTyCheck #
  ###################

  get-test-sets:
    name: Acquire test sets
    needs: validate_trigger
    runs-on: ubuntu-latest
    outputs:
      test-sets: ${{ steps.get-test-sets.outputs.test-sets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Get test sets
        id: get-test-sets
        run: |
          (
          echo -n "test-sets=["
          find tests/ -type f,l -name run | grep -v '/_' | grep -v '^tests/perf/' | \
            sed -e 's|^tests/|"|' -e 's|\(.*\)distribution/\([^-]*\)-[^/]*/run|\1distribution/\2-"|' -e 's|/[^/]*/run$|"|' | \
            sort | uniq | awk 'ORS=", "' | head -c -2
          echo "]"
          ) >> "$GITHUB_OUTPUT"

  deptycheck-test:
    name: Test DepTyCheck
    needs:
      - deptycheck-build-lib
      - get-test-sets
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    strategy:
      fail-fast: false # all test cases are more or less independent
      matrix:
        test_set: ${{ fromJSON(needs.get-test-sets.outputs.test-sets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Restore state with extra deps
        uses: DepTyCheck/idris2-actions/.github/actions/restore-pack-state@v1
        with:
          # There is always one element in pack_states (either HEAD or ./.pack-collection)
          state: ${{ fromJSON(needs.deptycheck-build-lib.outputs.pack_states)[0] }}

      - name: Sleep a random bit
        run: sleep "$(shuf -i 0-10 -n 1)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run tests for ${{ matrix.test_set }}
        run: pack test deptycheck "${TEST_SET}"
        env:
          TEST_SET: ${{ matrix.test_set }}

  ##############################
  # Measure DepTyCheck's perf. #
  ##############################

  # These tests assert on the *complexity class* of a generator, never on a time.
  # A slope of `log T` against `log n` does not depend on how fast the runner is,
  # which is what makes the measurement survive GitHub's infrastructure; see
  # `tests/perf/README.md` for the whole argument.
  #
  # Unlike the functional test sets, one matrix entry is one test directory
  # rather than one directory of tests. That is deliberate: each subject then
  # gets a runner to itself, so no two measurements ever share a machine. It is
  # also why every directory runs on every push: they run concurrently, so the
  # whole suite costs the wall-clock of its slowest member and nothing more.

  get-perf-sets:
    name: Acquire performance test sets
    needs: validate_trigger
    runs-on: ubuntu-latest
    outputs:
      perf-sets: ${{ steps.get-perf-sets.outputs.perf-sets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Get performance test sets
        id: get-perf-sets
        run: |
          (
          echo -n "perf-sets=["
          find tests/perf/ -type f,l -name run | grep -v '/_' | \
            sed -e 's|^tests/|"|' -e 's|/run$|"|' | \
            sort | uniq | awk 'ORS=", "' | head -c -2
          echo "]"
          ) >> "$GITHUB_OUTPUT"

  deptycheck-perf-test:
    name: Measure ${{ matrix.perf_set }}
    needs:
      - prepare-pack
      - deptycheck-build-lib
      - get-perf-sets
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    env:
      # A second test running beside the first would appear in the first one's
      # times as noise, so the pool must not be run in parallel with itself.
      NUM_THREADS: 1
      perf_set: ${{ matrix.perf_set }}
    strategy:
      fail-fast: false # every subject is measured independently of the others
      matrix:
        perf_set: ${{ fromJSON(needs.get-perf-sets.outputs.perf-sets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Restore built DepTyCheck
        uses: actions/download-artifact@v7
        with:
          name: built-deptycheck
      - name: Untar the `pack` dir
        run: .github/tar-pack restore "${{ env.pack_dir_file }}"

      - name: Sleep a random bit
        run: sleep "$(shuf -i 0-10 -n 1)"

      - name: Measure ${{ matrix.perf_set }}
        run: pack test deptycheck "${perf_set}"

      - name: Name the measurement artifact
        id: artifact-name
        if: ${{ !cancelled() }}
        run: echo "name=perf-data-${perf_set//\//-}" >> "$GITHUB_OUTPUT"

      # The verdict is in the job's status; these are the numbers behind it. They
      # are reported and never asserted on, because a constant factor measured on
      # one runner is not comparable with one measured on another. Watching them
      # over time is still the cheapest way to notice a constant-factor change.
      - name: Report the measurements
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ${perf_set}"
            echo
            echo '```'
            cat "tests/${perf_set}/perf-data.tsv" 2> /dev/null || echo 'no measurements were produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: tests/${{ matrix.perf_set }}/perf-data.tsv
          if-no-files-found: warn

  #################
  # Test examples #
  #################

  get-examples:
    name: Acquire examples
    needs: validate_trigger
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.get-examples.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Get examples
        id: get-examples
        run: |
          (
          echo -n "examples=["
          find examples/ -mindepth 1 -maxdepth 1 -type d | \
            sed 's|^examples/|"|' | sed 's|$|"|' | \
            sort | uniq | awk 'ORS=", "' | head -c -2
          echo "]"
          ) >> "$GITHUB_OUTPUT"

  examples-build:
    name: Build and test examples
    needs:
      - deptycheck-build-lib
      - get-examples
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    strategy:
      fail-fast: false # all test cases are more or less independent
      matrix:
        example: ${{ fromJSON(needs.get-examples.outputs.examples) }}
    env:
      EXAMPLE_NAME: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # https://docs.zizmor.sh/audits/#artipacked
      - name: Restore state with extra deps
        uses: DepTyCheck/idris2-actions/.github/actions/restore-pack-state@v1
        with:
          # There is always one element in pack_states (either HEAD or ./.pack-collection)
          state: ${{ fromJSON(needs.deptycheck-build-lib.outputs.pack_states)[0] }}

      - name: Sleep a random bit
        run: sleep "$(shuf -i 0-10 -n 1)"

      - name: Build ${{ matrix.example }}
        run: pack build "${EXAMPLE_NAME}"
      - name: Test ${{ matrix.example }}
        run: pack test "${EXAMPLE_NAME}"
